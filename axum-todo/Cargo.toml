[package]
name = "axum-todo"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["json", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["full"] }
async-trait = "0.1.92"
anyhow = "1.0.104"
thiserror = "2.0.21"
tower-http = { version = "0.7.1", features = ["limit", "request-id", "timeout", "trace", "util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
validator = { version = "0.21.0", features = ["derive"] }
